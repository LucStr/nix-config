[general]
# Colors and opacity come from the desktop theme: switch-theme.sh points
# theme.toml at themes/<scheme>.toml, or themes/default.toml if there is none.
import = ["~/.config/alacritty/theme.toml"]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/bash"

[font]
size = 11

[font.normal]
family = "Cousine Nerd Font Mono"

[terminal]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
