# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Battery-friendly idle policy. battery-refresh-rate.sh runs this instance on
# battery only; lock/sleep handling is in hypridle.conf (always on).

general {
    # No before_sleep_cmd here, so no reason to delay suspends.
    inhibit_sleep = 0
}

# 5 min: dim backlight
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: turn off displays
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 20 min: lock screen (hypridle.conf's lock_cmd handles the signal)
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# 60 min: suspend
listener {
    timeout = 3600
    on-timeout = loginctl suspend
}
