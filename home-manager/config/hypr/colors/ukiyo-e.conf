# Ukiyo-e: a woodblock print at dusk. Traditional Japanese color names.
$kachi = 0xff181d2b       # 褐色 kachi-iro, near-black indigo: window backgrounds
$kachi_deep = 0xff0b0e17  # inactive offset shadow
$sumi = 0xff1b2233        # ink on cream: text inside cartouches
$ai = 0xff223249          # 藍 ai, indigo: surfaces
$bero_ai = 0xff2d4f67     # ベロ藍 Prussian blue: inactive borders
$torinoko = 0xffdcd7ba    # 鳥の子 eggshell: text
$gofun = 0xffe4dac0       # 胡粉 shell white: cartouche paper
$kaki = 0xffe8834a        # 柿 persimmon: focused border, active workspace
$beni = 0xffc34043        # 紅 safflower red: offset shadows, seals
$fuji_gray = 0xff727169   # muted text
