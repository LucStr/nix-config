source = ~/.config/hypr/colors/ukiyo-e.conf

# Apply themes
exec = sh ~/.config/hypr/scripts/switch-theme.sh ukiyo-e

general {
    # gaps_in is per side, so windows sit 28px apart and the 8px shadow
    # still leaves a clear gap between them
    gaps_in = 14
    gaps_out = 24

    border_size = 3
    col.active_border = $kaki
    col.inactive_border = $bero_ai

    layout = dwindle

    col.nogroup_border = $bero_ai
    col.nogroup_border_active = $kaki
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    # Misregistered print block: a solid shadow offset down and right
    shadow {
        enabled = true
        range = 0
        render_power = 1
        offset = 8 8
        color = $beni
        color_inactive = $kachi_deep
    }

    dim_inactive = false
}

animations {
    enabled = yes

    bezier = stamp, 0.3, 1.4, 0.5, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 4, stamp, popin 95%
    animation = windowsOut, 1, 4, default, popin 90%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, default, slide
    animation = specialWorkspace, 1, 5, default, fade
}

dwindle {
    preserve_split = yes
}

$mainMod = SUPER

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Resize focused window with arrow keys, indicated with borders of a different color
bind = $mainMod, R, exec, hyprctl --batch keyword "general:col.active_border rgba(c34043ff);"
bind = $mainMod, R, exec, hyprctl --batch keyword "general:col.group_border_active rgba(c34043ff);"
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 15 0
binde = , left, resizeactive, -15 0
binde = , up, resizeactive, 0 -15
binde = , down, resizeactive, 0 15
bind = , escape, exec, hyprctl --batch keyword "general:col.active_border rgba(e8834aff);"
bind = , escape, exec, hyprctl --batch keyword "general:col.group_border_active rgba(e8834aff);"
bind = , escape, submap, reset
submap = reset
