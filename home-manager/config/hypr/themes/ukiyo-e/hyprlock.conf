# Ukiyo-e lock screen: the print as background, a large clock with a hard
# red offset (a second label drawn underneath), and a cartouche input field.

# Widgets draw in order, so the eDP-1 background goes on top of the generic one
background {
    monitor =
    path = ~/.config/hypr/themes/ukiyo-e/ukiyo-e-wide.png
    blur_passes = 0
    brightness = 0.8
}

background {
    monitor = eDP-1
    path = ~/.config/hypr/themes/ukiyo-e/ukiyo-e.png
    blur_passes = 0
    brightness = 0.8
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME: red offset block first, cream on top
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(c34043)
    font_size = 150
    font_family = Kaisei Tokumin Bold
    position = 160, 170
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(e4dac0)
    font_size = 150
    font_family = Kaisei Tokumin Bold
    position = 150, 180
    halign = left
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgb(dcd7ba)
    font_size = 26
    font_family = Kaisei Tokumin
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgb(0b0e17)
    position = 156, 40
    halign = left
    valign = center
}

# INPUT FIELD: red offset block, then the cartouche
shape {
    monitor =
    size = 360, 58
    color = rgb(c34043)
    rounding = 0
    border_size = 0
    position = 164, -68
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgb(1b2233)
    inner_color = rgb(e4dac0)
    font_color = rgb(1b2233)
    check_color = rgb(e8834a)
    fail_color = rgb(c34043)
    fade_on_empty = false
    font_family = Kaisei Tokumin
    placeholder_text = <span foreground="##6a6f7e">password</span>
    hide_input = false
    position = 156, -60
    halign = left
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(bash $HOME/.config/hypr/scripts/what-song.sh)"
    color = rgb(dcd7ba)
    font_size = 18
    font_family = Kaisei Tokumin, Font Awesome 6 Free Solid
    position = 0, 50
    halign = center
    valign = bottom
}
