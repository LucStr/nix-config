source = ~/.config/hypr/themes/summer-night/summer-night.conf

# Environement variables
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,rose-pine-hyprcursor
env = XCURSOR_SIZE,24

# Wayland-native rendering for Electron / Chromium apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Setup Path
env = PATH,$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.dotnet:$HOME/.nix-profile/bin:$HOME/.spicetify:$PATH
env = DOTNET_ROOT,$HOME/.dotnet

# OpenRC: silence the "not launched by uwsm" warning (uwsm requires systemd)
env = HYPRLAND_NO_SD_NOTIFY,1
env = UWSM_FINALIZE_VARNAMES,1

# Setup ssh agent
exec-once= ~/.config/hypr/scripts/start-keyring.sh
env= SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh

# eDP-1 refresh rate + hypridle, both gated on AC/battery
exec-once = ~/.config/hypr/scripts/battery-refresh-rate.sh

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto 
#monitor = HDMI-A-5,1920x1080@60,0x0,1
#monitor = HDMI-A-5,3440x1440@99.98,0x0,1
monitor = HDMI-A-1,3440x1440@99.98,0x0,1
monitor = eDP-1,2560x1600@240,3440x0,1.25
monitor=,preferred,auto,1
#monitor = eDP-1,2560x1600@60, 1920x0,1.33333

# Lid switch: disable internal panel on close, restore on open
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/battery-refresh-rate.sh --once
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = configure-gtk
exec-once = gentoo-pipewire-launcher
exec-once = hyprpaper

# Special workspace apps
exec-once = [workspace special:magic silent] firefox chat.google.com
exec-once = [workspace special:magic silent] sleep 2 && alacritty -e nvim ~/scratchpad


#exec-once = hyprlock

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.

cursor {
    no_hardware_cursors = true
#    allow_dumb_copy = true
}

# hypr-dynamic-cursors: shake-to-find (macOS-style)
# Install once: `hyprpm add https://github.com/VirtCode/hypr-dynamic-cursors && hyprpm enable dynamic-cursors`
exec-once = hyprpm reload -n

plugin {
    dynamic-cursors {
        enabled = true
        mode = none

        shake {
            enabled = true
            nearest = true
            threshold = 6.0
            base = 4.0
            speed = 4.0
            influence = 0.0
            limit = 0.0
            timeout = 2000
            effects = false
            ipc = false
        }
    }
}

debug {
  disable_logs = false
}

xwayland {
  force_zero_scaling = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us, ch
    kb_variant =
    kb_model =
    kb_options = grp:alt_space_toggle
    kb_rules =
    numlock_by_default=true

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    rounding = 10

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 5, default, fade
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

misc {
    vfr = true
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_autoreload = true
}

binds {
    movefocus_cycles_fullscreen = true
}

# Common JetBrains search/find popups → always floating & centered
windowrule {
  name = jetbrains-search
  float = on
  center = on
  match:title = ^(Search Everywhere|Find in Files|Replace in Files|Go to (File|Class|Symbol)|Recent Files)
}

# Generic fallback for JetBrains dialog-type windows (keeps main IDE tiled, only dialogs float)
windowrule {
  name = jetbrains-dialogs
  float = on
  center = on
  match:class = ^(jetbrains-.*)
  match:modal = true
}

workspace=1,monitor:HDMI-A-1,default:true
workspace=10,monitor:eDP-1,default:true

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Grouping
bind = $mainMod, G, togglegroup
bind = $mainMod CTRL, h, changegroupactive, b 
bind = $mainMod CTRL, l, changegroupactive, f

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, alacritty
bind = $mainMod, W, killactive, 
bind = CTRL ALT, Q, exit, 
bind = SUPER_SHIFT, R, exec, hyprctl reload
bind = $mainMod, E, exec, dolphin
bind = $mainMod, F, togglefloating, 
#bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, P, exec, hyprlock # dwindle
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, Tab, fullscreenstate, 2 0
bind = $mainMod, Space, movefocus, r
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim keys 
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


bind = $mainMod, B, togglespecialworkspace, magic
bind = $mainMod SHIFT, B, movetoworkspace, special:magic
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod, S, movetoworkspace, +0
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod, S, movetoworkspace, special:magic
# bind = $mainMod, S, togglespecialworkspace, magic


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod ALT, l, resizeactive, 10 0
bind = $mainMod ALT, h, resizeactive, -10 0
bind = $mainMod ALT, k, resizeactive, 0 -10
bind = $mainMod ALT, j, resizeactive, 0 10

# Move window with shift key
bind = $mainMod SHIFT, h, movewindoworgroup, l
bind = $mainMod SHIFT, j, movewindoworgroup, d
bind = $mainMod SHIFT, k, movewindoworgroup, u
bind = $mainMod SHIFT, l, movewindoworgroup, r

# Wofi Menus
bind = $mainMod, D, exec, pkill wofi || wofi --show drun --term=kitty --width=600 --height=450 --columns 1 -I -s ~/.config/wofi/theme.css -o $MAIN_DISPLAY
bind = SUPER_SHIFT, T, exec, sh .config/wofi/scripts/theme-switcher.sh "-o $MAIN_DISPLAY"
bind = SUPER, V, exec, cliphist list | wofi --dmenu --term=kitty --width=1200 --heigh=900 -s ~/.config/wofi/theme.css --cache-file /dev/null | cliphist decode | wl-copy


# Hardware controls using function keys
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%

binde = , XF86AudioRaiseVolume, exec, pactl -- set-sink-volume @DEFAULT_SINK@ +5%
#binde = , XF86AudioRaiseVolume, exec, sh /home/mathis_hyprland/.config/hypr/scripts/notify-volume.sh

binde = , XF86AudioLowerVolume, exec, pactl -- set-sink-volume @DEFAULT_SINK@ -5%
#binde = , XF86AudioLowerVolume, exec, sh /home/mathis_hyprland/.config/hypr/scripts/notify-volume.sh

bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
#bind = , XF86AudioMute, exec, sh /home/mathis_hyprland/.config/hypr/scripts/notify-volume.sh


bind = , XF86AudioPlay, exec, playerctl play-pause

bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

