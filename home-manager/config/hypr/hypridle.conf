# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Always-on instance (exec-once in hyprland.conf): lock before sleep, restore
# the panel after it. Runs on AC too -- only the idle timers are battery-only,
# and they live in hypridle-battery.conf, a second instance that
# battery-refresh-rate.sh starts and stops.
#
# This used to be a single instance that battery-refresh-rate.sh killed on AC,
# which took lock-before-sleep down with it: closing the lid on a charger never
# locked, and undocking a closed laptop (AC drops, elogind suspends ~200 ms
# later) suspended before the battery restart could take its sleep inhibitor.
#
# hypridle warns "No rules configured" at startup for this file; that is fine.

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Undocking with the lid shut leaves zero monitors; bring eDP-1 back before
    # locking so hyprlock starts with an output to draw on (see
    # scripts/monitor-guard.sh). A no-op on every other suspend.
    before_sleep_cmd = ~/.config/hypr/scripts/monitor-guard.sh --once before-sleep; loginctl lock-session
    # ';' not '&&': a non-zero "dpms on" (e.g. no monitors yet) must not skip
    # the monitor restore -- that is the step that brings the panel back.
    after_sleep_cmd = hyprctl dispatch dpms on ; ~/.config/hypr/scripts/battery-refresh-rate.sh --once
    # Hold the suspend until hyprlock reports the session locked.
    inhibit_sleep = 3
    # Leave org.freedesktop.ScreenSaver to the battery instance: only one
    # process can own the name, and that is the one with timers to inhibit.
    ignore_dbus_inhibit = true
}
